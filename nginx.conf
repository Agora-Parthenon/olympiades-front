server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue est servie par index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets buildés sont fingerprintés : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La config runtime ne doit jamais être mise en cache
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
